<!DOCTYPE html>
<!-- Cube Remote · Copyright (c) 2026 José Renato · Jr_Tech_OFC. Todos os direitos reservados. -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Cube Remote</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app" data-view="stage">
    <!-- cabeçalho -->
    <header class="topbar">
      <div class="brand">
        <img src="img/logo.svg" alt="" class="brand-logo">
        <div class="brand-text"><b>Cube Remote</b><span>by Jr_Tech_OFC</span></div>
      </div>
      <div class="top-actions">
        <button id="btnStatus" class="chip" type="button"><i class="dot"></i><span>Desconectada</span></button>
        <button id="btnUndo" class="icon-btn" type="button" aria-label="Desfazer última alteração"></button>
        <button id="btnLock" class="icon-btn" type="button" aria-label="Trava de palco"></button>
      </div>
    </header>

    <!-- navegação -->
    <nav class="nav" aria-label="Seções">
      <button data-go="stage" class="active" type="button"><span class="nav-ico" data-icon="pedal"></span><span>Palco</span></button>
      <button data-go="culto" type="button"><span class="nav-ico" data-icon="culto"></span><span>Culto</span></button>
      <button data-go="memory" type="button"><span class="nav-ico" data-icon="memory"></span><span>Memórias</span></button>
      <button data-go="tuner" type="button"><span class="nav-ico" data-icon="tuner"></span><span>Afinador</span></button>
      <button data-go="tools" type="button"><span class="nav-ico" data-icon="tools"></span><span>Ferramentas</span></button>
      <button data-go="settings" type="button"><span class="nav-ico" data-icon="settings"></span><span>Ajustes</span></button>
    </nav>

    <main class="views">
      <!-- ============ PALCO ============ -->
      <section id="view-stage" class="view active" aria-label="Palco">
        <div class="stage">
          <div id="presetBar" class="preset-bar" role="group" aria-label="Preset em edição"></div>
          <div id="moduleBar" class="module-bar" role="group" aria-label="Módulos"></div>
          <div id="tiles" class="tiles"></div>
        </div>
        <div id="stageState" class="stage-state" hidden></div>
      </section>

      <!-- ============ CULTO ============ -->
      <section id="view-culto" class="view scroll" aria-label="Culto"></section>

      <!-- ============ MEMÓRIAS ============ -->
      <section id="view-memory" class="view scroll" aria-label="Memórias"></section>

      <!-- ============ AFINADOR ============ -->
      <section id="view-tuner" class="view" aria-label="Afinador"></section>

      <!-- ============ APRENDER ============ -->
      <section id="view-learn" class="view scroll" aria-label="Aprender"></section>

      <!-- ============ FERRAMENTAS ============ -->
      <section id="view-tools" class="view scroll" aria-label="Ferramentas"></section>

      <!-- ============ AJUSTES ============ -->
      <section id="view-settings" class="view scroll" aria-label="Ajustes"></section>
    </main>
  </div>

  <!-- tela de ajuste de um controle (abre ao tocar num botão da tela Palco) -->
  <section id="adjust" class="adjust" hidden role="dialog" aria-modal="true" aria-labelledby="adjTitle"></section>

  <!-- diálogos (confirmações e explicações) -->
  <div id="dialog" class="sheet dialog" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"></div>
  </div>

  <!-- log -->
  <section id="logPanel" class="log-panel" hidden aria-label="Log"></section>

  <!-- trava de palco -->
  <div id="lockShield" class="lock-shield" hidden>
    <p>Controles travados. Segure o cadeado por 1 segundo para destravar.</p>
  </div>

  <div id="toast" class="toast" hidden role="status"></div>
  <div id="busy" class="busy" hidden><div class="spinner"></div><p id="busyText">Aguarde</p></div>

  <script src="js/icons.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/model.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/learn-data.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/tuner.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/live.js"></script>
  <script src="js/setlist.js"></script>
  <script src="js/irlab.js"></script>
  <script src="js/delay.js"></script>
  <script src="js/discover.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
