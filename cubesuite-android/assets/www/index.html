<!DOCTYPE html>
<!-- Cube Remote · Copyright (c) 2026 José Renato · Jr_Tech_OFC. Todos os direitos reservados. -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Cube Remote</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- gradientes compartilhados pelos knobs -->
  <svg width="0" height="0" class="defs" aria-hidden="true">
    <defs>
      <radialGradient id="g-skirt" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ecE9e1"/><stop offset=".7" stop-color="#c9c5bb"/><stop offset="1" stop-color="#9d998f"/></radialGradient>
      <radialGradient id="g-cap" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#3a3d43"/><stop offset="1" stop-color="#15171a"/></radialGradient>
      <linearGradient id="g-metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f2f4"/><stop offset=".45" stop-color="#a9aeb5"/><stop offset="1" stop-color="#5e646c"/></linearGradient>
    </defs>
  </svg>

  <div id="app" class="app" data-view="pedal">
    <!-- cabeçalho -->
    <header class="topbar">
      <div class="brand">
        <img src="img/logo.svg" alt="" class="brand-logo">
        <div class="brand-text"><b>Cube Remote</b><span>by Jr_Tech_OFC</span></div>
      </div>
      <div class="top-actions">
        <button id="btnStatus" class="chip" type="button"><i class="dot"></i><span>Desconectada</span></button>
        <button id="btnUndo" class="icon-btn" type="button" aria-label="Desfazer última alteração"></button>
        <button id="btnLock" class="icon-btn" type="button" aria-label="Trava de palco"></button>
      </div>
    </header>

    <!-- navegação -->
    <nav class="nav" aria-label="Seções">
      <button data-go="pedal" class="active" type="button"><span class="nav-ico" data-icon="pedal"></span><span>Pedal</span></button>
      <button data-go="learn" type="button"><span class="nav-ico" data-icon="learn"></span><span>Aprender</span></button>
      <button data-go="tools" type="button"><span class="nav-ico" data-icon="tools"></span><span>Ferramentas</span></button>
      <button data-go="settings" type="button"><span class="nav-ico" data-icon="settings"></span><span>Ajustes</span></button>
    </nav>

    <main class="views">
      <!-- ============ PEDAL ============ -->
      <section id="view-pedal" class="view active" aria-label="Pedal">
        <div class="pedal-bar">
          <div class="editing"><span class="led-dot" id="editingLed"></span><span id="editingText">Preset A</span></div>
          <button id="btnTuner" class="bar-btn" type="button"><span data-icon="tuner"></span><span>Afinador</span></button>
          <button id="btnSend" class="bar-btn" type="button"><span data-icon="send"></span><span>Enviar</span></button>
        </div>
        <div id="panel" class="panel" data-style="knobs" data-mode="edit">
          <div class="fs-col" id="fsCol"></div>
          <div class="ctl-col" id="ctlCol"></div>
          <div class="tuner-readout" id="tunerReadout" hidden></div>
        </div>
        <div id="pedalState" class="pedal-state" hidden></div>
      </section>

      <!-- ============ APRENDER ============ -->
      <section id="view-learn" class="view scroll" aria-label="Aprender"></section>

      <!-- ============ FERRAMENTAS ============ -->
      <section id="view-tools" class="view scroll" aria-label="Ferramentas"></section>

      <!-- ============ AJUSTES ============ -->
      <section id="view-settings" class="view scroll" aria-label="Ajustes"></section>
    </main>
  </div>

  <!-- ajuste fino de um controle (abre ao tocar no knob) -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
  </div>

  <!-- explicação de um controle (botão !) e diálogos -->
  <div id="dialog" class="sheet dialog" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"></div>
  </div>

  <!-- log -->
  <section id="logPanel" class="log-panel" hidden aria-label="Log"></section>

  <!-- trava de palco -->
  <div id="lockShield" class="lock-shield" hidden>
    <p>Controles travados. Segure o cadeado por 1 segundo para destravar.</p>
  </div>

  <div id="toast" class="toast" hidden role="status"></div>
  <div id="busy" class="busy" hidden><div class="spinner"></div><p id="busyText">Aguarde</p></div>

  <script src="js/icons.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/model.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/learn-data.js"></script>
  <script src="js/pedal.js"></script>
  <script src="js/tuner.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
